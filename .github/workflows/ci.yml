name: CI

# Har push aur PR par: build + har service ke tests, GitHub Actions
# par hi verify hote hain. Local "pass" claim kaafi nahi hai — ye
# workflow hi CI ka sach hai.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (TypeScript, all packages + services)
        run: pnpm -r build

      - name: Test auth-api
        run: pnpm --filter @dusrel/auth-api test

      - name: Test mail-api
        run: pnpm --filter @dusrel/mail-api test
